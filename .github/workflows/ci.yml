name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  # PR Dependency Vulnerability Gate (No NVD API key required)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review (fail on high/critical)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Build & Unit Tests 
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Build and run tests (all modules)
        run: mvn clean test

      - name: Package fat JAR
        run: mvn package -DskipTests -pl task-planner-app -am

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nioflow-app-jar
          path: task-planner-app/target/task-planner-app-*-jar-with-dependencies.jar
          retention-days: 7

  # Integration Tests 
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'schedule'
    env:
      NIOFLOW_ENABLE_DB: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Run integration tests
        run: mvn test -pl task-planner-app -am -Dnioflow.jwtSecret="ci-integration-test-secret-minimum-32-chars"

  # Container Build 
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — CI validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nioflow-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependency Vulnerability Scan 
  dependency-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Cache OWASP Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-dependency-check-db-v1-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-db-v1-

      - name: Run OWASP Dependency Check (CVSS >= 7 fails build)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DnvdApiKey="${NVD_API_KEY}" \
              -DdataDirectory="$HOME/.dependency-check-data"
          else
            mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -Dautoupdate=false \
              -DdataDirectory="$HOME/.dependency-check-data"
          fi

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
