name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  # Build & Unit Tests 
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Build and run tests (all modules)
        run: mvn clean test

      - name: Package fat JAR
        run: mvn package -DskipTests -pl task-planner-app -am

      - name: Upload fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nioflow-app-jar
          path: task-planner-app/target/task-planner-app-*-jar-with-dependencies.jar
          retention-days: 7

  # Integration Tests 
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'schedule'
    env:
      NIOFLOW_ENABLE_DB: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Run integration tests
        run: mvn test -pl task-planner-app -am -Dnioflow.jwtSecret="ci-integration-test-secret-minimum-32-chars"

  # Container Build 
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — CI validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nioflow-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dependency Vulnerability Scan 
  dependency-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Run OWASP Dependency Check (CVSS ≥ 7 fails advisory)
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
