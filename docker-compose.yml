version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JDBC_URL=jdbc:postgresql://db:5432/corehttp
      - DB_USER=postgres
      - DB_PASS=${DB_PASS:-changeme}
      - COREHTTP_ENABLE_DB=true
      - COREHTTP_CORS_ORIGIN=${COREHTTP_CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - corehttp-net

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=corehttp
      - POSTGRES_PASSWORD=${DB_PASS:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corehttp-net

networks:
  corehttp-net:
    driver: bridge

volumes:
  postgres_data:
